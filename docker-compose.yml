# Deployment compose (Portainer, git-backed stack). Same topology as the
# movingfirm stacks: db → one-shot migrate → app services.
#
# Images are built on the host from this checkout for now (the `build:` lines).
# Follow-up: a CI workflow that publishes ghcr.io/muutto365/luuri and a
# LUURI_IMAGE_TAG indirection like movingfirm-admin, so the host compiles
# nothing.
#
# The web service publishes no host port: it joins the shared `proxy` network
# and Nginx Proxy Manager routes a hostname to `luuri:8000`. The database
# stays on a project-local network only.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luuri
      POSTGRES_USER: luuri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - luuri_db:/var/lib/postgresql/data
    networks:
      - luuri_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luuri -d luuri"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: luuri:${LUURI_IMAGE_TAG:-local}
    command: ["python", "migrate.py"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg2://luuri:${POSTGRES_PASSWORD}@db:5432/luuri
      SESSION_SECRET: ${SESSION_SECRET}
    networks:
      - luuri_internal
    depends_on:
      db:
        condition: service_healthy

  luuri:
    build: .
    image: luuri:${LUURI_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://luuri:${POSTGRES_PASSWORD}@db:5432/luuri
      SESSION_SECRET: ${SESSION_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      MOVINGFIRM_BACKEND_URL: ${MOVINGFIRM_BACKEND_URL:-}
      MOVINGFIRM_INTERNAL_TOKEN: ${MOVINGFIRM_INTERNAL_TOKEN:-}
      TWENTY_API_URL: ${TWENTY_API_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      ANALYTICS_UX_EVENTS_URL: ${ANALYTICS_UX_EVENTS_URL:-}
    networks:
      - luuri_internal
      - proxy
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    image: luuri:${LUURI_IMAGE_TAG:-local}
    command: ["python", "worker.py"]
    restart: unless-stopped
    hostname: luuri-worker
    environment:
      DATABASE_URL: postgresql+psycopg2://luuri:${POSTGRES_PASSWORD}@db:5432/luuri
      SESSION_SECRET: ${SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      MOVINGFIRM_BACKEND_URL: ${MOVINGFIRM_BACKEND_URL:-}
      MOVINGFIRM_INTERNAL_TOKEN: ${MOVINGFIRM_INTERNAL_TOKEN:-}
      TWENTY_API_URL: ${TWENTY_API_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      ANALYTICS_UX_EVENTS_URL: ${ANALYTICS_UX_EVENTS_URL:-}
    networks:
      - luuri_internal
      - proxy
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  luuri_internal:
  proxy:
    # NPM's network, created outside every stack (same as movingfirm-admin).
    external: true

volumes:
  luuri_db:
